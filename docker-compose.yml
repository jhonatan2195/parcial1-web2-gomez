services:
  biblioteca-db:
    image: postgres:16
    container_name: biblioteca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: biblio
      POSTGRES_PASSWORD: secreto123
      POSTGRES_DB: biblioteca
    ports:
      - "5433:5432"
    volumes:
      - biblioteca_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblio -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  biblioteca_data:
